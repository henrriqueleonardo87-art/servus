<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="servusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d8df8"/>
      <stop offset="45%" stop-color="#735fd9"/>
      <stop offset="100%" stop-color="#4d3ec2"/>
    </linearGradient>
    <linearGradient id="innerShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e135e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo Squircle com gradiente nobre SERVUS -->
  <rect width="64" height="64" rx="15" fill="url(#servusBg)"/>
  <rect width="64" height="64" rx="15" fill="url(#innerShine)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Emblema Oficial S com sombra refinada -->
  <g filter="url(#shadow)">
    <path d="M 18.7 19.2 C 21.9 16.3, 26.1 14.7, 31.5 14.7 C 38.9 14.7, 44.0 17.9, 44.0 23.2 C 44.0 35.2, 20.3 28.8, 20.3 40.5 C 20.3 45.9, 25.3 49.3, 33.1 49.3 C 38.4 49.3, 42.9 47.7, 46.1 44.5"
          fill="none"
          stroke="#ffffff"
          stroke-width="5.9"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>